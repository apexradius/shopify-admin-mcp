name: CI

on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: apexradius/ci-templates/.github/workflows/shopify-theme.yml@v1.0.3
    with:
      lint-asset-js: false
      secrets-scan: false
