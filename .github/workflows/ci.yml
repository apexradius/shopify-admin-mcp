name: CI

on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: apexradius/ci-templates/.github/workflows/typescript-pkg.yml@main
    with:
      node-version: '20'
      package-manager: 'npm'
      # Keep the existing ESLint + Prettier toolchain wired via apex-mcp-shared.
      linter: 'eslint'
      run-typecheck: true
      run-build: true
      run-tests: true
      secrets-scan: true
